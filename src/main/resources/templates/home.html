<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WittieCoder Portfolio</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa; 
        }
		@media (max-width: 768px) {
		  nav ul {
		    display: flex;
		    flex-direction: column;
		    gap: 10px;
		  }
		}		
		

        .hero {
            background: #ffffff;
            padding: 80px 20px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.05);
        }

        .highlight {
            color: #2c3e50; 
        }

        .btn-custom {
            background-color: #4a6fa5;
            color: white;
        }

        .btn-custom:hover {
            background-color: #3b5a85;
        }

        .navbar {
            background-color: #2c3e50;
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }
		
		.navbar-toggler {
		    border: 1px solid white;
		}

		.navbar-toggler-icon {
		    filter: invert(1);
		}
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="#">WittieCoder</a>

        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Projects</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="/pdf/WITNESS PETRO NORBERT(CV).pdf">My CV</a></li>
            </ul>
        </div>

    </div>
</nav>

<!-- HERO SECTION -->
<div class="container mt-5">
    <div class="hero text-center">
		<img th:src="@{images/myPhoto.jpg}"  style="border-radius: 50%; width: 200px; height: 200px;"/>

        <h1 class="highlight">Hello, I'm Witness Petro Norbert</h1>

        <h5 class="text-muted mt-3">
            Spring Boot | Web Developer
        </h5>

        <p class="mt-4 text-secondary">
            I design and build modern web systems using Java, Spring Boot,
            PostgreSQL, HTML, CSS, Bootstrap and JavaScript.
        </p>

        <a th:href="@{/projects}" class="btn btn-custom mt-3 px-4 py-2">
            View My Projects
        </a>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
