<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Projects</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
		@media (max-width: 768px) {
		  nav ul {
		    display: flex;
		    flex-direction: column;
		    gap: 10px;
		  }
		}

        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card-custom:hover {
            transform: translateY(-5px);
        }

        .project-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .btn-custom {
            background-color: #4a6fa5;
            color: white;
        }

        .btn-custom:hover {
            background-color: #3b5a85;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" th:href="@{/}">WittieCoder</a>
</nav>

<div class="container mt-5">

    <h2 class="mb-4"> My Projects</h2>

    <div class="row g-4">

        <!-- SMARTCODE -->
        <div class="col-md-6">
            <div class="card card-custom p-3">

                <!-- IMAGE -->
                <img src="/images/smartcode.png" class="project-img" alt="SmartCode">

                <h4 class="mt-3">SmartCode E-Commerce System</h4>

                <p class="text-muted">
                    Online clothing sales system built with Spring Boot.
                </p>

                <p>
                    <b>Tech:</b> Java, Spring Boot, PostgreSQL, Bootstrap
                </p>

                <a href="https://github.com/Witness-Coder/SmartCode"
                   target="_blank"
                   class="btn btn-custom btn-sm">
                    🔗 GitHub
                </a>

            </div>
        </div>

        <!-- INVENTORY -->
        <div class="col-md-6">
            <div class="card card-custom p-3">

                <!-- IMAGE -->
                <img src="/images/inventory.png" class="project-img" alt="Inventory">

                <h4 class="mt-3">Inventory Management System</h4>

                <p class="text-muted">
                    System for managing office assets and inventory.
                </p>

                <p>
                    <b>Tech:</b> Java, Spring Boot, PostgreSQL
                </p>

                <a href="https://github.com/Witness-Coder/InventoryManagement"
                   target="_blank"
                   class="btn btn-custom btn-sm">
                    🔗 GitHub
                </a>

            </div>
        </div>

    </div>

</div>

</body>
</html>
